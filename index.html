</style></head><body><div id=app></div><nav id=nav></nav><div id=modal></div><div id=toast></div><script>
const $=s=>document.querySelector(s),M=$('#modal'),uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)},P=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)};

const sn=id=>(S.subjects.find(x=>x.id==id)||{name:'Unassigned'}).name,cn=id=>(S.cats.find(x=>x.id==id)||{name:'General'}).name,f1=n=>Number.isInteger(n)?n:n.toFixed(1);

const open=()=>new Promise((r,j)=>{const q=indexedDB.open('vitals',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});

function applyAll(){const s=S.set,d=s.theme=='dark'||(s.theme=='system'&&matchMedia('(prefers-color-scheme:dark)').matches),h=document.documentElement;h.dataset.t=d?'dark':'light';h.style.setProperty('--ff',FONTS[s.font]);const m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?'#151817':'#55785c';try{localStorage.vt=s.theme;localStorage.vf=s.font}catch(e){}}

function fresh(){const t=today(),sb=['Medicine','Surgery','Pediatrics','OBG','Orthopaedics'].map(n=>({id:uid(),name:n,target:75})),ct=['Clinical posting','Theory','Practical','Seminar'].map(n=>({id:uid(),name:n,target:75})),sl=[['11:30','12:20'],['12:20','13:00'],['14:00','15:00'],['15:00','16:00']],slots=[];

/* sessions: generated from timetable, overridden by saved records */
function gen(d){const dow=P(d).getDay(),o=[],ad=x=>{if(!o.some(y=>y.s==x.s&&y.e==x.e))o.push(x)};if(S.set.off.includes(dow))return o;

for(const b of S.blocks)if(b.start<=d&&d<=b.end)for(const t of b.slots)if(t.day==dow)ad({key:'b:'+b.id+':'+t.id,date:d,subj:t.subj,cat:t.cat,s:t.s,e:t.e,block:b.id});return o}
function sessions(d){const g=gen(d).map(x=>{const r=S.rec[d+'|'+x.key];return r?{...x,...r}:{...x,st:'none'}}),k=new Set(g.map(x=>x.key));
for(const q in S.rec)if(q.startsWith(d+'|')&&!k.has(S.rec[q].key))g.push(S.rec[q]);return g.filter(x=>!x.del).sort((a,b)=>a.s.localeCompare(b.s))}
const cnt=s=>s.st=='p'?[1,1]:s.st=='a'?[0,1]:s.st=='n'&&S.set.nsAbs?[0,1]:null;
function agg(from,to){const R={},t=today();for(let d=from;d<=to;d=addDays(d,1))for(const s of sessions(d)){
for(const k of['all','s'+s.subj,'c'+s.cat,...(s.post?['p'+s.post]:[]),...(s.block?['b'+s.block]:[])]){const g=R[k]||(R[k]={A:0,N:0,F:0,c:0,u:0});
if(d>t){if(s.st!='c')g.F+=w(s);continue}if(s.st=='c')g.c++;else{const c=cnt(s);if(!c)g.u++;else{g.N+=w(s);g.A+=c[0]*w(s)}}}}return R}
const tgt=k=>{const t=k[0],i=k.slice(1);let x=t=='s'?S.subjects.find(a=>a.id==i):t=='c'?S.cats.find(a=>a.id==i):t=='p'?S.subjects.find(a=>a.id==(S.postings.find(p=>p.id==i)||{}).subj):0;return x?x.target:S.set.target};
function calc(g,T){const t=T/100,{A,N,F}=g;if(!N)return{pct:null,col:'var(--mut)',line:'No countable sessions yet.'};const pct=A/N*100;
const col=pct>=T+S.set.warn?'var(--ok)':pct>=T?'var(--amb)':'var(--bad)';let line;
if(pct>=T){const al=t>0?Math.max(0,Math.floor(A/t-N+1e-9)):Infinity;line=`Can still miss ${al==Infinity?'any':f1(al)} more${pct<T+S.set.warn?' - close to target!':'.'}`}
else{const nd=t>=1?Infinity:Math.ceil((t*N-A)/(1-t)-1e-9);line=`BELOW target: attend next ${nd==Infinity?'(impossible at 100%)':f1(nd)} in a row.`}
if(F)line+=` If all ${f1(F)} upcoming attended: ${((A+F)/(N+F)*100).toFixed(1)}%.`;return{pct,col,line}}
function card(name,k,g){g=g||{A:0,N:0,F:0,c:0,u:0};const T=tgt(k),r=calc(g,T),u=S.set.hrs?'h':'';
return`<div class=card style="border-left:5px solid ${r.col}"><span class=pct style="color:${r.col}">${r.pct==null?'—':r.pct.toFixed(1)+'%'}</span><b>${esc(name)}</b><div class=m>Held ${f1(g.N)}${u} · Attended ${f1(g.A)}${u} · Missed ${f1(g.N-g.A)}${u} · Target ${T}%</div><div class=m>${r.line}</div><div class=m>Cancelled ${g.c} · ${g.u?`<span class=wn>${g.u} unmarked (not counted)</span>`:'0 unmarked'}</div></div>`}
/* modal form helper */

const so=()=>[['','Unassigned']].concat(S.subjects.map(x=>[x.id,x.name])),co=()=>S.cats.map(x=>[x.id,x.name]),yn=[['1','Yes'],['0','No']];

function dayH(d){const ss=sessions(d);return`<div class=card><div class=row><b>${fmt(d)}</b></div>${ss.length?ss.map(s=>row(d,s)).join(''):'<p class=m>No sessions this day.</p>'}<div class=row><button class=b data-a=addS data-v="${d}">+ Session</button><button class=b data-a=addN data-v="${d}">+ Note</button>${ss.some(s=>s.st=='none')?`<button class=b data-a=bulk data-v="${d}">All unmarked → Present</button>`:''}${undo?'<button class=b data-a=undo>Undo bulk</button>':''}</div>${S.notes.filter(n=>n.date==d).map(n=>`<div class=m>📝 ${esc(n.title)}</div>`).join('')}</div>`}
const V={home(){const t=today(),R=agg(S.set.track,t),o=R.all||{A:0,N:0,u:0},days=Math.floor((Date.now()-new Date(S.set.bk||0))/864e5);
return`<h2>Vitals</h2>${S.set.hp||S.set.hu?`<div class=row>${S.set.hp?`<span class=card>Overall <b>${o.N?(o.A/o.N*100).toFixed(1)+'%':'—'}</b></span>`:''}${S.set.hu?`<span class=card>Unmarked <b>${o.u}</b></span>`:''}</div>`:''}${o.u?`<div class=ban>⚠ ${o.u} past session(s) unmarked - they are NOT counted until you mark them. Use Calendar to fix.</div>`:''}${!S.set.bk||days>14?'<div class=ban>💾 Back up your data (Settings → BACK UP EVERYTHING).</div>':''}${dayH(t)}<button class="b pri" data-a=go data-v=cal>Open calendar</button>`},
cal(){const[y,m]=cm.split('-').map(Number),n=new Date(y,m,0).getDate(),t=today();let h=D.map(x=>`<div class=h>${x[0]}</div>`).join('');for(let i=0;i<new Date(y,m-1,1).getDay();i++)h+='<i></i>';

h+=`<button class="${d==sel?'sel':d==t?'td':''}" data-a=day data-v="${d}">${i}<br>${c.p?'<u class=p></u>':''}${c.a||c.n?'<u class=a></u>':''}${c.c?'<u class=c></u>':''}${c.none?`<u class="${f?'f':'x'}"></u>`:''}</button>`}
return`<h2>Calendar</h2><div class=row><button class=b data-a=mo data-v=-1>◀</button><b class=sp style=text-align:center>${P(cm+'-01').toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button class=b data-a=mo data-v=1>▶</button></div><div class=cal>${h}</div><p class=m><u class=p></u>present <u class=a></u>absent <u class=c></u>cancelled <u class=x></u>unmarked <u class=f></u>upcoming</p>${dayH(sel)}`},
sub(){const R=agg(S.set.track,S.set.end),pk=S.postings.map(p=>card(p.name+' ('+sn(p.subj)+(p.arch?', archived':'')+')','p'+p.id,R['p'+p.id])).join('');
const ks=new Set(Object.keys(R).filter(k=>k[0]=='s'));return`<h2>Subjects</h2><div class=row><button class="b pri" data-a=eSub data-v="">+ Subject</button></div>${[...S.subjects.map(s=>'s'+s.id),...(ks.has('s')?['s']:[])].map(k=>card(sn(k.slice(1)),k,R[k])).join('')}<h3>Session types</h3>${S.cats.map(c=>card(c.name,'c'+c.id,R['c'+c.id])).join('')}<h3>Postings</h3>${pk||'<p class=m>No postings yet. Add in Settings.</p>'}`},
