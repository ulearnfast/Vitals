<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4ef"><title>Vitals</title><link rel="manifest" href="manifest.json"><style>
:root{--bg:#f7f5f1;--surface:#fff;--surface2:#f0eee9;--text:#252824;--muted:#777b73;--line:#e5e2da;--accent:#66856e;--accent2:#d9e5d8;--danger:#b85c55;--warn:#b58a32;--shadow:0 4px 18px #24251b0a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.05px}body.dark{--bg:#171b19;--surface:#222825;--surface2:#2b332e;--text:#edf0e9;--muted:#aab2a9;--line:#39423c;--accent:#9abd9d;--accent2:#34483a;--danger:#e18b83;--warn:#e0bd6c;--shadow:none}body.font-rounded{font-family: "Trebuchet MS",system-ui,sans-serif}body.font-serif{font-family:Georgia,serif}body.font-mono{font-family:ui-monospace,monospace}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px 18px 10px;border-bottom:1px solid var(--line)}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:24px;font-weight:750;letter-spacing:-1px}.brand small{font-size:10px;color:var(--muted);letter-spacing:2px;margin-left:7px;font-weight:600}.date{color:var(--muted);font-size:12px;margin-top:3px}.top-actions{display:flex;gap:8px}.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:8px 11px;font-size:17px}
main{max-width:760px;margin:auto;padding:16px 15px 90px}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:8px 5px calc(8px + env(safe-area-inset-bottom))}.tab{border:0;background:none;color:var(--muted);font:inherit;font-size:11px;padding:5px 12px;display:flex;flex-direction:column;align-items:center;gap:3px}.tab span:first-child{font-size:19px}.tab.active{color:var(--accent);font-weight:750}
h1{font-size:22px;margin:5px 0 14px;letter-spacing:-.5px}h2{font-size:16px;margin:20px 0 10px}.muted{color:var(--muted)}.small{font-size:12px}.panel,.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{font-size:24px;font-weight:750}.subject-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.subject{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px;text-align:left;color:var(--text);min-height:90px}.subject strong{display:block;font-size:15px;margin-bottom:7px}.subject .pct{font-size:22px;font-weight:750}.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 12px;font:inherit;font-size:13px}.btn.primary{background:var(--accent);border-color:var(--accent);color:white;font-weight:700}.btn.danger{color:var(--danger)}.btn.smallbtn{padding:6px 9px;font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:7px}.field{display:flex;flex-direction:column;gap:5px;margin:9px 0}.field label{font-size:12px;color:var(--muted);font-weight:650}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}.field textarea{min-height:70px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.session{padding:11px 0;border-bottom:1px solid var(--line)}.session:last-child{border:0}.time{font-size:12px;color:var(--muted);min-width:95px}.status{display:flex;gap:5px}.status button{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:8px;padding:6px 9px;font-size:12px}.status button.on{background:var(--accent);color:white;border-color:var(--accent)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.weekday,.day{font-size:11px;text-align:center}.weekday{color:var(--muted);padding:5px 0}.day{min-height:47px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 1px;color:var(--text)}.day.today{outline:2px solid var(--accent)}.day.good{background:color-mix(in srgb,var(--accent) 28%,var(--surface));}.day.bad{background:color-mix(in srgb,var(--danger) 26%,var(--surface))}.day.pending{background:color-mix(in srgb,#e5b94f 34%,var(--surface))}.day.selected{border:2px solid var(--accent)}.day .count{font-size:9px;color:var(--muted)}.section-title{display:flex;align-items:center;justify-content:space-between}.setting-item{padding:13px 0;border-bottom:1px solid var(--line)}.setting-item:last-child{border:0}.swatches{display:flex;gap:7px;flex-wrap:wrap}.swatch{border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface);color:var(--text);font-size:12px}.swatch.active{border-color:var(--accent);font-weight:750}.empty{text-align:center;padding:30px 15px;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}.hidden{display:none!important}.pill{font-size:10px;border-radius:20px;padding:3px 7px;background:var(--surface2);color:var(--muted)}.bar{height:7px;background:var(--surface2);border-radius:8px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--accent)}.modalback{position:fixed;inset:0;background:#0008;z-index:30;display:flex;align-items:flex-end;justify-content:center}.modal{background:var(--surface);color:var(--text);width:min(100%,620px);max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center}.previewrow{font-size:12px;padding:7px 0;border-bottom:1px solid var(--line)}@media(min-width:650px){.tabs{left:50%;transform:translateX(-50%);width:760px;border:1px solid var(--line);border-radius:16px 16px 0 0}.modalback{align-items:center}.modal{border-radius:18px}}
</style></head><body><header><div class="top"><div><div class="brand"><span style="color:var(--accent);font-size:20px;margin-right:5px">✿</span>vitals <small>MBBS HUB</small></div><div class="date" id="todayline"></div></div><div class="top-actions"><button class="iconbtn" onclick="toggleTheme()" aria-label="Toggle dark mode">◐</button></div></div></header><main id="app"></main><nav class="tabs"><button class="tab active" data-tab="overview" onclick="go('overview')"><span>⌂</span>Overview</button><button class="tab" data-tab="calendar" onclick="go('calendar')"><span>▦</span>Calendar</button><button class="tab" data-tab="attendance" onclick="go('attendance')"><span>▤</span>Attendance</button><button class="tab" data-tab="settings" onclick="go('settings')"><span>⚙</span>Settings</button></nav><div id="modalroot"></div>
<script>
const KEY='vitals-data-v3';
const DEFAULT_SUBJECTS=['General Medicine','General Surgery','Paediatrics','Ophthalmology','ENT','OBGYN','Dermatology','Orthopaedics'];
const DEFAULT_CATEGORIES={'LECTURE':75,'SGT':75,'SDL':75,'AETCOM':75,'POSTING':80};
const fresh=()=>({subjects:DEFAULT_SUBJECTS.map(name=>({id:crypto.randomUUID?crypto.randomUUID():id(),name,required:75,categoryRequirements:{...DEFAULT_CATEGORIES}})),sessions:[],holidays:[],prefs:{theme:'spring',dark:false,font:'system',requirements:{}},imports:[],recurring:[]});
let db=load(),tab='overview',selectedDate=iso(new Date()),calMonth=new Date();let pendingImport=null;
// One-time safe migration: seed the requested subjects even if an older database already contains sessions.
if(!db.defaultsSeeded){db.subjects=Array.isArray(db.subjects)?db.subjects:[];const norm=x=>String(x||'').trim().toLowerCase();for(const name of DEFAULT_SUBJECTS){let existing=db.subjects.find(s=>norm(s.name)===norm(name));if(!existing){db.subjects.push({id:id(),name,required:75,categoryRequirements:{...DEFAULT_CATEGORIES}})}else{existing.categoryRequirements={...DEFAULT_CATEGORIES,...(existing.categoryRequirements||{})};existing.required=existing.required??75;}}db.recurring=db.recurring||[];db.holidays=db.holidays||[];db.imports=db.imports||[];db.prefs=db.prefs||{theme:'spring',dark:false,font:'system',requirements:{}};db.defaultsSeeded=true;save();}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const themes={spring:['#b34e78','#f2dce6'],summer:['#a87500','#f4df8d'],autumn:['#a64f32','#efd0bd'],ocean:['#287f91','#c7e5e9'],winter:['#657baf','#dce2f1']};
function apply(){let [a,b]=themes[db.prefs.theme]||themes.spring;document.documentElement.style.setProperty('--accent',a);document.documentElement.style.setProperty('--accent2',b);document.body.classList.toggle('dark',!!db.prefs.dark);document.body.classList.remove('font-rounded','font-serif','font-mono');if(db.prefs.font!=='system')document.body.classList.add('font-'+db.prefs.font)}
function toggleTheme(){db.prefs.dark=!db.prefs.dark;save();apply();render()}
function go(t){tab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render()}
function subjectName(id){return db.subjects.find(s=>s.id===id)?.name||'Unassigned'}
function sessionsOn(date){return db.sessions.filter(s=>s.date===date&&!s.deleted).sort((a,b)=>(a.start||'').localeCompare(b.start||''))}
function statusLabel(s){return s.status==='P'?'Present':s.status==='A'?'Absent':s.status==='C'?'Cancelled':'Pending'}
function stats(list){let done=list.filter(s=>s.status==='P'||s.status==='A'),p=done.filter(s=>s.status==='P').length,a=done.filter(s=>s.status==='A').length,n=p+a,r=Number(list[0]?.required??75),pct=n?p/n*100:null;let safe=n&&r>0?Math.max(0,Math.floor((p/(r/100)-n)+1e-9)):0;let recover=(n&&pct!==null&&pct<r&&r<100)?Math.ceil(((r/100*n)-p)/(1-r/100)):0;return {p,a,n,r,pct,safe,recover}}
function subjectSessions(id){return db.sessions.filter(s=>s.subjectId===id&&s.status!=='C'&&!s.deleted)}
function categoryStats(id,cat){return subjectSessions(id).filter(s=>(s.category||'Lecture')===cat)}
function render(){apply();document.getElementById('todayline').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});let el=document.getElementById('app');el.innerHTML=({overview,calendar,attendance,settings})[tab]();bind()}
function overview(){let today=sessionsOn(iso(new Date())),all=db.sessions.filter(s=>s.status!=='C'&&!s.deleted),st=stats(all);return `<h1>Overview</h1><div class="grid"><div class="panel"><div class="muted small">Overall attendance</div><div class="stat">${st.pct===null?'—':st.pct.toFixed(1)+'%'}</div><div class="muted small">${st.p} present · ${st.a} absent</div></div><div class="panel"><div class="muted small">Timetable sessions</div><div class="stat">${db.sessions.length}</div><div class="muted small">${db.subjects.length} subjects added</div></div></div><div class="section-title"><h2>Today's timetable</h2><button class="btn smallbtn" onclick="openSession()">+ Add</button></div><div class="panel">${today.length?today.map(sessionHTML).join(''):`<div class="empty"><b>No sessions scheduled</b>Add a class or import your timetable to get started.</div>`}</div><div class="panel"><div class="section-title"><b>Get started</b><span class="pill">Your data, your rules</span></div><p class="muted small">Vitals starts empty. Add subjects, import a timetable, then mark attendance from your calendar or overview.</p><div class="actions"><button class="btn primary" onclick="openSubject()">Add subject</button><button class="btn" onclick="document.getElementById('csvfile').click()">Import timetable</button></div></div>`}
function sessionHTML(s){return `<div class="session"><div class="row between"><div><div class="small muted">${esc(s.start||'')}${s.end?' – '+esc(s.end):''} · ${esc(s.category||'Lecture')}</div><b>${esc(s.topic||subjectName(s.subjectId))}</b><div class="small muted">${esc(subjectName(s.subjectId))}${s.staff?' · '+esc(s.staff):''}</div></div><div class="status">${['P','A','C'].map(x=>`<button class="${s.status===x?'on':''}" onclick="mark('${s.id}','${x}')">${x}</button>`).join('')}</div></div><div class="actions" style="margin-top:6px"><button class="btn smallbtn" onclick="openSession('${s.id}')">Edit</button></div></div>`}
function calendar(){let y=calMonth.getFullYear(),m=calMonth.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),days=Array.from({length:42},(_,i)=>{let d=new Date(start);d.setDate(start.getDate()+i);return d});return `<div class="section-title"><h1>Calendar</h1><div class="actions"><button class="btn smallbtn" onclick="shiftMonth(-1)">‹</button><button class="btn smallbtn" onclick="shiftMonth(1)">›</button></div></div><div class="panel"><div class="row between"><b>${calMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button class="btn smallbtn" onclick="calMonth=new Date();selectedDate=iso(new Date());render()">Today</button></div><div class="calendar">${['S','M','T','W','T','F','S'].map(x=>`<div class="weekday">${x}</div>`).join('')}${days.map(d=>{let date=iso(d),ss=sessionsOn(date).filter(s=>s.status!=='C'),done=ss.filter(s=>s.status==='P'||s.status==='A'),cls=done.length===ss.length&&ss.length?'good':done.some(s=>s.status==='A')?'bad':done.length?'pending':ss.length?'pending':'';return `<button class="day ${cls} ${date===selectedDate?'selected':''} ${date===iso(new Date())?'today':''}" onclick="selectedDate='${date}';render()"><b>${d.getDate()}</b><div class="count">${ss.length?ss.length+' class':''}</div></button>`}).join('')}</div><div class="small muted" style="margin-top:9px">Full-day shading: all present · any absent · pending</div></div><div class="section-title"><h2>${new Date(selectedDate+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</h2><button class="btn smallbtn" onclick="openSession()">+ Add session</button></div><div class="panel">${sessionsOn(selectedDate).length?sessionsOn(selectedDate).map(sessionHTML).join(''):`<div class="empty">No sessions for this date.</div>`}</div>`}
function shiftMonth(n){calMonth.setMonth(calMonth.getMonth()+n);render()}
function attendance(){if(!db.subjects.length)return `<h1>Attendance</h1><div class="panel empty"><b>No subjects yet</b>Add your subjects and set attendance requirements to see your dashboard.<button class="btn primary" onclick="openSubject()">Add subject</button></div>`;return `<h1>Attendance</h1><div class="subject-grid">${db.subjects.map(s=>{let x=stats(subjectSessions(s.id));return `<button class="subject" onclick="subjectDetail('${s.id}')"><strong>${esc(s.name)}</strong><span class="pct">${x.pct===null?'—':x.pct.toFixed(1)+'%'}</span><div class="small muted">${x.p}/${x.n} attended · target ${s.required??75}%</div></button>`}).join('')}</div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="openSubject()">+ Add subject</button></div>`}
function subjectDetail(id){let s=db.subjects.find(x=>x.id===id);if(!s)return;let cats=[...new Set([...Object.keys(s.categoryRequirements||{}),...db.sessions.filter(x=>x.subjectId===id).map(x=>x.category||'Lecture')])];let all=stats(subjectSessions(id));modal(`<div class="modalhead"><h2>${esc(s.name)}</h2><button class="btn" onclick="closeModal()">✕</button></div><div class="panel"><div class="stat">${all.pct===null?'—':all.pct.toFixed(1)+'%'}</div><div class="muted small">Overall · ${all.p} present / ${all.n} held · target ${s.required??75}%</div><div class="small">Safe additional absences: <b>${all.safe}</b> · Attend consecutively to recover: <b>${all.recover}</b></div></div><div class="actions"><button class="btn" onclick="closeModal();openSubject('${id}')">Edit subject</button></div>${cats.map(c=>{let a=stats(categoryStats(id,c));a.r=s.categoryRequirements?.[c]??s.required??75; a.safe=a.n&&a.r>0?Math.max(0,Math.floor((a.p/(a.r/100)-a.n)+1e-9)):0; a.recover=(a.n&&a.pct!==null&&a.pct<a.r&&a.r<100)?Math.ceil(((a.r/100*a.n)-a.p)/(1-a.r/100)):0; let req=a.r;return `<div class="panel"><b>${esc(c)}</b><div class="row between"><span class="stat">${a.pct===null?'—':a.pct.toFixed(1)+'%'}</span><span class="small muted">Target ${req}%</span></div><div class="small muted">${a.p} present · ${a.a} absent · ${a.n} held</div><div class="small">Safe absences: ${a.safe} · Needed to recover: ${a.recover}</div></div>`}).join('')}`)}
function settings(){return `<h1>Settings</h1><div class="panel"><div class="setting-item"><b>Appearance</b><div class="small muted">Choose a palette, display mode and font.</div><h2>Seasonal theme</h2><div class="swatches">${[['spring','Spring · Blush'],['summer','Summer · Sunflower'],['autumn','Autumn · Terracotta'],['ocean','Ocean · Teal'],['winter','Winter · Blue']].map(([v,l])=>`<button class="swatch ${db.prefs.theme===v?'active':''}" onclick="setPref('theme','${v}')">${l}</button>`).join('')}</div><h2>Display mode</h2><div class="actions"><button class="btn ${!db.prefs.dark?'primary':''}" onclick="setPref('dark',false)">Light</button><button class="btn ${db.prefs.dark?'primary':''}" onclick="setPref('dark',true)">Dark</button></div><h2>Font</h2><div class="field"><select onchange="setPref('font',this.value)">${[['system','System'],['rounded','Rounded'],['serif','Serif'],['mono','Monospace']].map(([v,l])=>`<option value="${v}" ${db.prefs.font===v?'selected':''}>${l}</option>`).join('')}</select></div></div></div><div class="panel"><div class="section-title"><b>Subjects & attendance targets</b><button class="btn smallbtn" onclick="openSubject()">+ Add</button></div>${db.subjects.length?db.subjects.map(s=>`<div class="setting-item row between"><div><b>${esc(s.name)}</b><div class="small muted">Overall target ${s.required??75}%</div></div><div class="actions"><button class="btn smallbtn" onclick="openSubject('${s.id}')">Edit</button><button class="btn smallbtn danger" onclick="deleteSubject('${s.id}')">Delete</button></div></div>`).join(''):`<p class="muted small">No subjects added.</p>`}</div><div class="panel"><div class="section-title"><b>Timetable & sessions</b><button class="btn smallbtn" onclick="openSession()">+ Add session</button></div><p class="small muted">${db.sessions.length} sessions · ${db.imports.length} import batches</p><div class="actions"><button class="btn" onclick="document.getElementById('csvfile').click()">Import CSV</button><button class="btn" onclick="exportData()">Export backup</button><button class="btn" onclick="document.getElementById('backupfile').click()">Restore backup</button></div><div class="setting-item"><b>Import history</b>${db.imports.length?db.imports.map(i=>`<div class="row between small" style="padding:7px 0"><span>${esc(i.name)} · ${i.count} rows</span><button class="btn smallbtn danger" onclick="undoImport('${i.id}')">Undo</button></div>`).join(''):'<p class="small muted">No imports yet.</p>'}</div></div><div class="panel"><div class="section-title"><b>Recurring classes</b><button class="btn smallbtn" onclick="openRecurring()">+ Add recurring class</button></div><p class="small muted">Create weekly patterns across a date range. Individual generated sessions remain editable.</p>${(db.recurring||[]).map(r=>`<div class="row between setting-item small"><span><b>${esc(subjectName(r.subjectId))}</b> · ${esc(r.category)} · ${r.days.map(d=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]).join(', ')}<br><span class="muted">${r.startDate} to ${r.endDate}</span></span><button class="btn smallbtn danger" onclick="deleteRecurring('${r.id}')">Delete pattern</button></div>`).join('')}</div><div class="panel"><b>Holidays & weekly off</b><p class="small muted">Add a whole-day holiday or date range. Cancelled sessions are separate from holidays.</p><button class="btn" onclick="addHoliday()">Add holiday</button>${db.holidays.map(h=>`<div class="row between small setting-item"><span>${esc(h.name)} · ${h.start}${h.end&&h.end!==h.start?' to '+h.end:''}</span><button class="btn smallbtn danger" onclick="removeHoliday('${h.id}')">Remove</button></div>`).join('')}</div><div class="panel"><b>Data management</b><p class="small muted">Back up before resetting. Reset removes data stored in this Vitals installation only.</p><div class="actions"><button class="btn" onclick="exportData()">Export all data</button><button class="btn" onclick="document.getElementById('backupfile').click()">Import backup</button><button class="btn danger" onclick="resetData()">Reset app</button></div></div><input id="csvfile" type="file" accept=".csv,text/csv" hidden onchange="readCSV(this.files[0])"><input id="backupfile" type="file" accept=".json,application/json" hidden onchange="restoreData(this.files[0])">`}
function setPref(k,v){db.prefs[k]=v;save();render()}
function modal(content){document.getElementById('modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}
function closeModal(){document.getElementById('modalroot').innerHTML=''}
function id(){return Math.random().toString(36).slice(2,10)}
function openSubject(sid=''){let s=db.subjects.find(x=>x.id===sid)||{name:'',required:75,categoryRequirements:{...DEFAULT_CATEGORIES}};modal(`<div class="modalhead"><h2>${sid?'Edit':'Add'} subject</h2><button class="btn" onclick="closeModal()">✕</button></div><div class="field"><label>Subject name</label><input id="sname" value="${esc(s.name)}" placeholder="e.g. General Medicine"></div><div class="field"><label>Default required attendance (%)</label><input id="sreq" type="number" min="0" max="100" value="${s.required??75}"></div><div class="field"><label>Class types and individual attendance requirements</label><textarea id="scats" placeholder="Lecture: 75&#10;Posting: 90&#10;Practical: 80">${esc(Object.entries(s.categoryRequirements||{}).map(([k,v])=>k+': '+v).join('\n'))}</textarea><div class="small muted">One per line: Class type: percentage. Example: Lecture: 75</div></div><button class="btn primary" onclick="saveSubject('${sid}')">Save subject</button>`)}
function saveSubject(sid){let name=document.getElementById('sname').value.trim(),r=Number(document.getElementById('sreq').value);if(!name||r<0||r>100)return alert('Enter a subject name and a target from 0–100.');let reqs={...DEFAULT_CATEGORIES};document.getElementById('scats').value.split(/\n/).forEach(line=>{let m=line.match(/^\s*(.+?)\s*:\s*(\d+(?:\.\d+)?)\s*$/);if(m&&Number(m[2])>=0&&Number(m[2])<=100)reqs[m[1].trim()]=Number(m[2])});if(sid){Object.assign(db.subjects.find(x=>x.id===sid),{name,required:r,categoryRequirements:reqs})}else db.subjects.push({id:id(),name,required:r,categoryRequirements:reqs});save();closeModal();render()}
function deleteSubject(sid){if(!confirm('Delete this subject and its linked sessions?'))return;db.subjects=db.subjects.filter(s=>s.id!==sid);db.sessions=db.sessions.filter(s=>s.subjectId!==sid);save();render()}
function openSession(sid=''){let s=db.sessions.find(x=>x.id===sid)||{date:selectedDate,start:'',end:'',category:'Lecture',status:'',topic:'',staff:''};modal(`<div class="modalhead"><h2>${sid?'Edit':'Add'} session</h2><button class="btn" onclick="closeModal()">✕</button></div><div class="field"><label>Subject</label><select id="xsubject"><option value="">Choose subject</option>${db.subjects.map(x=>`<option value="${x.id}" ${s.subjectId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>Date</label><input id="xdate" type="date" value="${s.date}"></div><div class="field"><label>Category</label><input id="xcat" value="${esc(s.category||'Lecture')}" placeholder="Lecture / Posting / SGT"></div><div class="field"><label>Start time</label><input id="xstart" type="time" value="${s.start||''}"></div><div class="field"><label>End time</label><input id="xend" type="time" value="${s.end||''}"></div></div><div class="field"><label>Topic</label><input id="xtopic" value="${esc(s.topic||'')}"></div><div class="field"><label>Faculty / staff</label><input id="xstaff" value="${esc(s.staff||'')}"></div><button class="btn primary" onclick="saveSession('${sid}')">Save session</button> ${sid?`<button class="btn danger" onclick="deleteSession('${sid}')">Delete session</button>`:''}`)}
function saveSession(sid){let x={subjectId:document.getElementById('xsubject').value,date:document.getElementById('xdate').value,category:document.getElementById('xcat').value.trim()||'Lecture',start:document.getElementById('xstart').value,end:document.getElementById('xend').value,topic:document.getElementById('xtopic').value.trim(),staff:document.getElementById('xstaff').value.trim()};if(!x.date)return alert('Choose a date.');if(sid)Object.assign(db.sessions.find(s=>s.id===sid),x);else db.sessions.push({id:id(),...x,status:'',sourceBatch:null});selectedDate=x.date;save();closeModal();render()}
function deleteSession(sid){if(!confirm('Delete this session?'))return;db.sessions=db.sessions.filter(s=>s.id!==sid);save();closeModal();render()}
function mark(sid,status){let s=db.sessions.find(x=>x.id===sid);if(s){s.status=s.status===status?'':status;save();render()}}
function openRecurring(){modal(`<div class="modalhead"><h2>Add recurring class</h2><button class="btn" onclick="closeModal()">✕</button></div><div class="field"><label>Subject</label><select id="rsubject"><option value="">Choose subject</option>${db.subjects.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>Class type</label><input id="rcat" value="Lecture"></div><div class="field"><label>Start time</label><input id="rstart" type="time"></div><div class="field"><label>End time</label><input id="rend" type="time"></div><div class="field"><label>First date</label><input id="rfrom" type="date" value="${iso(new Date())}"></div><div class="field"><label>Last date</label><input id="rto" type="date"></div></div><div class="field"><label>Repeat on</label><div class="actions">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i)=>`<label class="btn smallbtn"><input type="checkbox" class="rday" value="${i}" ${i>0&&i<6?'checked':''}> ${d}</label>`).join('')}</div></div><div class="field"><label>Topic (optional)</label><input id="rtopic"></div><div class="field"><label>Faculty (optional)</label><input id="rstaff"></div><button class="btn primary" onclick="saveRecurring()">Generate recurring sessions</button>`)}
function saveRecurring(){let subjectId=document.getElementById('rsubject').value,startDate=document.getElementById('rfrom').value,endDate=document.getElementById('rto').value,days=[...document.querySelectorAll('.rday:checked')].map(x=>+x.value);if(!subjectId||!startDate||!endDate||endDate<startDate||!days.length)return alert('Choose a subject, date range and at least one weekday.');let rec={id:id(),subjectId,category:document.getElementById('rcat').value.trim()||'Lecture',start:document.getElementById('rstart').value,end:document.getElementById('rend').value,startDate,endDate,days,topic:document.getElementById('rtopic').value.trim(),staff:document.getElementById('rstaff').value.trim()};db.recurring=db.recurring||[];db.recurring.push(rec);let d=new Date(startDate+'T12:00:00'),last=new Date(endDate+'T12:00:00'),count=0;for(;d<=last;d.setDate(d.getDate()+1)){if(days.includes(d.getDay())){let date=iso(d);if(!db.sessions.some(s=>s.date===date&&s.subjectId===subjectId&&s.start===rec.start&&s.category===rec.category)){db.sessions.push({id:id(),date,subjectId,category:rec.category,start:rec.start,end:rec.end,topic:rec.topic,staff:rec.staff,status:'',sourceBatch:null,recurringId:rec.id});count++}}}save();closeModal();render();alert(`Created ${count} sessions.`)}
function deleteRecurring(rid){if(!confirm('Delete this pattern? Already generated sessions will remain.'))return;db.recurring=(db.recurring||[]).filter(x=>x.id!==rid);save();render()}
function addHoliday(){modal(`<div class="modalhead"><h2>Add holiday</h2><button class="btn" onclick="closeModal()">✕</button></div><div class="field"><label>Name</label><input id="hname" placeholder="Holiday name"></div><div class="formgrid"><div class="field"><label>From</label><input id="hstart" type="date"></div><div class="field"><label>To</label><input id="hend" type="date"></div></div><button class="btn primary" onclick="saveHoliday()">Save holiday</button>`)}
function saveHoliday(){let name=document.getElementById('hname').value.trim(),start=document.getElementById('hstart').value,end=document.getElementById('hend').value||start;if(!name||!start)return alert('Enter a name and start date.');db.holidays.push({id:id(),name,start,end});save();closeModal();render()}
function removeHoliday(hid){db.holidays=db.holidays.filter(h=>h.id!==hid);save();render()}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vitals-backup-'+iso(new Date())+'.json';a.click();URL.revokeObjectURL(a.href)}
function restoreData(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.subjects||!x.sessions||!x.prefs)throw 0;if(!confirm('Replace current Vitals data with this backup? Export current data first if needed.'))return;db=x;save();render();alert('Backup restored.')}catch(e){alert('This backup file is not valid.')}};r.readAsText(file)}
function resetData(){if(!confirm('Reset ALL Vitals subjects, sessions, holidays and settings?'))return;if(!confirm('This cannot be undone unless you have exported a backup. Continue?'))return;db=fresh();save();render()}
function deleteImport(idb){db.sessions=db.sessions.filter(s=>s.sourceBatch!==idb||s.status);db.imports=db.imports.filter(x=>x.id!==idb);save();render()}
function undoImport(idb){if(!confirm('Undo this import? Marked attendance will be preserved.'))return;deleteImport(idb)}
function parseCSV(text){let rows=[],row=[],v='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'&&q&&text[i+1]==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))rows.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(x=>x.trim()))rows.push(row);return rows}
function readCSV(file){if(!file)return;let r=new FileReader();r.onload=()=>{let rows=parseCSV(r.result),headers=rows.shift().map(x=>x.trim().toLowerCase()),find=(row,names)=>{let i=headers.findIndex(h=>names.includes(h));return i>=0?(row[i]||'').trim():''};let parsed=rows.map((row,i)=>{let date=find(row,['date']),parts=date.split(/[\/-]/),isoDate=parts.length===3?(parts[2].length===4?`${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`:date):date;return {date:isoDate,day:find(row,['day']),time:find(row,['time']),category:find(row,['type','category'])||'Lecture',subject:find(row,['subject']),topic:find(row,['topic']),staff:find(row,['staff','faculty','teacher']),row:i+2}});let issues=parsed.filter(x=>!x.date||!x.subject||isNaN(Date.parse(x.date+'T12:00:00'))|| (x.day&&new Date(x.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long'}).toLowerCase()!==x.day.toLowerCase()));pendingImport={name:file.name,rows:parsed,issues};showImportReview()};r.readAsText(file)}
function showImportReview(){let p=pendingImport,subjects=[...new Set(p.rows.map(x=>x.subject))];modal(`<div class="modalhead"><h2>Review timetable</h2><button class="btn" onclick="closeModal()">✕</button></div><p class="small muted">${esc(p.name)} · ${p.rows.length} rows · ${subjects.length} subjects</p><div class="panel"><b>${p.issues.length} rows need attention</b><p class="small muted">Check dates, day/date mismatches and missing subjects before importing. Invalid rows will be skipped unless corrected.</p></div><div style="max-height:40vh;overflow:auto">${p.rows.slice(0,100).map(x=>`<div class="previewrow"><b>Row ${x.row} · ${esc(x.subject)}</b><br>${esc(x.date)} ${esc(x.day)} · ${esc(x.time)}<br>${esc(x.topic)} ${p.issues.includes(x)?'<span style="color:var(--danger)"> · Check date/day</span>':''}</div>`).join('')}</div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="commitImport()">Import valid rows</button><button class="btn" onclick="closeModal()">Cancel</button></div>`)}
function commitImport(){let p=pendingImport,batch=id(),count=0;for(let x of p.rows){if(!x.date||!x.subject||isNaN(Date.parse(x.date+'T12:00:00')))continue;let sub=db.subjects.find(s=>s.name.toLowerCase()===x.subject.toLowerCase());if(!sub){sub={id:id(),name:x.subject,required:75,categoryRequirements:{}};db.subjects.push(sub)}let times=x.time.match(/(\d{1,2}:\d{2}\s*[AP]M?)\s*[-–]\s*(\d{1,2}:\d{2}\s*[AP]M?)/i);let convert=t=>{if(!t)return'';let z=t.trim().toUpperCase().match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/);if(!z)return'';let h=+z[1],m=z[2];if(z[3]==='PM'&&h<12)h+=12;if(z[3]==='AM'&&h===12)h=0;return String(h).padStart(2,'0')+':'+m};let start=times?convert(times[1]):'',end=times?convert(times[2]):'';if(db.sessions.some(s=>s.date===x.date&&s.subjectId===sub.id&&s.start===start&&s.topic===x.topic))continue;db.sessions.push({id:id(),date:x.date,subjectId:sub.id,category:x.category,start,end,topic:x.topic,staff:x.staff,status:'',sourceBatch:batch});count++}db.imports.push({id:batch,name:p.name,count});pendingImport=null;save();closeModal();go('calendar');alert(`Imported ${count} sessions. Please review your timetable.`)}
function bind(){}
render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
